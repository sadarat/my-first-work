<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
   <div class="atm-card"> 
     <!--“This div holds everything that belongs to the card: header, number, name, expiry date, and logo.” --> 


    <div class="card-header">
      <h3>Bank of Khyber</h3>
      <img src="https://img.icons8.com/ios-filled/50/ffffff/sim-card-chip.png" alt="chip" class="chip" />
     </div>


      <!-- “This section helps place the bank name on the left and the chip image on the right in one straight line.” -->


    <div class="card-number">1234 5678 9012 3456</div>
    
    
     <!--This div displays the ATM card number in the center, with spacing between digits and a large font size to make it look realistic.” -->

     <div class="card-footer">
      
      
      <!--“This part is used to layout the cardholder name and expiry side-by-side, just like on real credit or debit cards.” -->

      <div class="card-holder">

        <span>Card Holder</span> 
        
        <!-- used span to wrap the labels like ‘Card Holder’ and ‘Valid Thru’ so I can style them separately — making them smaller and lighter than the actual card information.” -->
       
       
        <strong>Marwa Noor</strong> 
      </div>

      <div class="card-expiry">
        <span>Valid Thru</span>
        <strong>04/30</strong>
      </div>
    </div><br>
    
   <div class="logo">VISA</div> 
   
   <!--  the branding of the card provider (VISA, Mastercard, etc.) -->


  </div>


 
</body>
</html>
